<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You are special!</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #23081e 0%, #0c020d 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      animation: fadeIn 0.5s ease forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrapper {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px solid #ff4b93;
      padding: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(255, 75, 147, 0.45);
      margin-bottom: 25px;
      background: rgba(255, 75, 147, 0.08);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .fancy-heading {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #ff65a5;
      margin-bottom: 8px;
    }

    .sub-heading {
      color: #dfdfea;
      font-size: 0.95rem;
      font-weight: 300;
      margin-bottom: 30px;
    }

    .action-btn {
      background: linear-gradient(135deg, #e60067, #b0004e);
      border: none;
      color: white;
      padding: 13px 32px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(230, 0, 103, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease;
    }

    .action-btn:hover {
      transform: scale(1.04);
    }

    /* Screen 2: Meter */
    .progress-box {
      width: 100%;
      margin: 30px 0 20px 0;
    }

    .progress-bar-bg {
      width: 100%;
      height: 18px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #b0004e, #ff2a85);
      border-radius: 20px;
      transition: width 0.08s ease;
    }

    .meter-percent {
      font-size: 2.8rem;
      font-weight: 700;
      color: #ff529a;
      margin: 15px 0 5px;
    }

    .meter-warning {
      color: #ffbf00;
      background: rgba(255, 191, 0, 0.12);
      border: 1px dashed rgba(255, 191, 0, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 15px;
      display: none;
    }

    /* Screen 3: Reveal Cards */
    .cards-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }

    .reveal-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 105, 180, 0.2);
      border-radius: 18px;
      padding: 13px 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.92rem;
      color: #ff9ec4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
    }

    .reveal-card.revealed {
      background: rgba(230, 0, 103, 0.18);
      border-color: rgba(255, 105, 180, 0.5);
      color: #ffffff;
      cursor: default;
    }

    /* Screen 4: Letter */
    .letter-envelope {
      width: 100%;
      background: #ffb8d2;
      border-radius: 20px;
      padding: 30px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: #2b0c1e;
      position: relative;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .ribbon-icon {
      font-size: 2.8rem;
      color: #df1b68;
      margin-bottom: 10px;
    }

    .envelope-text {
      color: #611339;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .note-content-box {
      display: none;
      background: #ffc2d8;
      border-radius: 20px;
      padding: 24px;
      color: #2b0b1c;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
      width: 100%;
      min-height: 250px;
      position: relative;
    }

    .note-content-box .heart-tag {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 10px;
      color: #e60067;
    }

    .note-text {
      min-height: 140px;
      font-weight: 400;
    }

    .floating-heart {
      position: absolute;
      top: 10px;
      font-size: 1.1rem;
      color: #e60067;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Step 1: Welcome -->
    <div class="screen active" id="screen-1">
      <div class="avatar-wrapper">
        <img src="https://media.tenor.com/J3-L9Vv6w48AAAAM/cute-bear.gif" alt="Cute Avatar" />
      </div>
      <h1 class="fancy-heading">Hey Beautiful</h1>
      <p class="sub-heading">Do you even know how cute you are?</p>
      <button class="action-btn" onclick="startCutenessTest()">Open My Heart 💗</button>
    </div>

    <!-- Step 2: Cuteness Meter -->
    <div class="screen" id="screen-2">
      <p class="sub-heading" style="margin-bottom: 0;">Measuring your cuteness...</p>
      <div class="meter-percent" id="percent-val">0%</div>
      <div class="progress-box">
        <div class="progress-bar-bg">
          <div class="progress-fill" id="progress-bar"></div>
        </div>
      </div>
      <p id="meter-status" style="font-size: 0.85rem; color: #bbb;">Calculating cuteness...</p>
      <div class="meter-warning" id="meter-warning">⚠️ WARNING: TOO CUTE TO HANDLE</div>
    </div>

    <!-- Step 3: Reveal Cards -->
    <div class="screen" id="screen-3">
      <div style="font-size: 2.2rem; margin-bottom: 4px; color: #ff529a;">💖</div>
      <h2 style="font-size: 1.4rem; font-weight: 600;">Just for you</h2>
      <p class="sub-heading" style="font-size: 0.85rem; margin-bottom: 15px;">Tap each one to reveal</p>
      
      <div class="cards-list">
        <div class="reveal-card" onclick="revealCard(this, 'You look adorable')">🤍</div>
        <div class="reveal-card" onclick="revealCard(this, 'You have the sweetest vibe')">🤍</div>
        <div class="reveal-card" onclick="revealCard(this, 'You make things feel lighter')">🤍</div>
        <div class="reveal-card" onclick="revealCard(this, 'You are naturally charming')">🤍</div>
        <div class="reveal-card" onclick="revealCard(this, 'You make everything feel more special')">🤍</div>
      </div>

      <button class="action-btn" onclick="goToScreen(4)">See more ➜</button>
    </div>

    <!-- Step 4: Secret Note -->
    <div class="screen" id="screen-4">
      <h2 class="fancy-heading" style="font-size: 2.3rem; margin-bottom: 20px;">A little note for you</h2>
      
      <!-- Envelope Closed -->
      <div class="letter-envelope" id="envelope" onclick="openLetter()">
        <span class="floating-heart" style="left: 14px;">💖</span>
        <span class="floating-heart" style="right: 14px;">💖</span>
        <div class="ribbon-icon">🎀</div>
        <div class="envelope-text">Tap to open</div>
      </div>

      <!-- Letter Opened -->
      <div class="note-content-box" id="letter-box">
        <div class="heart-tag">💗</div>
        <div class="note-text" id="typewriter-text"></div>
        <div style="text-align: center; margin-top: 15px;">
          <button class="action-btn" id="next-btn" style="display: none; padding: 9px 24px; font-size: 0.85rem;" onclick="goToScreen(5)">
            One more thing ➜
          </button>
        </div>
      </div>
    </div>

    <!-- Step 5: Final Cute Outro -->
    <div class="screen" id="screen-5">
      <div class="avatar-wrapper">
        <img src="https://media.tenor.com/uR6q1vHjEosAAAAM/cute-hug.gif" alt="Special" />
      </div>
      <h2 class="fancy-heading" style="font-size: 2.2rem; color: #ffb8d2;">You'll always be special to me</h2>
    </div>

  </div>

  <script>
    function goToScreen(screenNumber) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + screenNumber).classList.add('active');
    }

    function startCutenessTest() {
      goToScreen(2);
      let progress = 0;
      const bar = document.getElementById('progress-bar');
      const text = document.getElementById('percent-val');
      const warning = document.getElementById('meter-warning');
      const status = document.getElementById('meter-status');

      const interval = setInterval(() => {
        progress += 2;
        if (progress > 120) {
          clearInterval(interval);
          warning.style.display = 'inline-block';
          status.style.display = 'none';
          setTimeout(() => {
            goToScreen(3);
          }, 2400);
          return;
        }
        bar.style.width = Math.min(progress, 100) + '%';
        text.innerText = progress + '%';
      }, 35);
    }

    function revealCard(element, message) {
      if (!element.classList.contains('revealed')) {
        element.classList.add('revealed');
        element.innerText = message;
      }
    }

    const noteMessage = "I just wanted to tell you something... you really are special in a way that's hard to explain. There's a softness in the way you talk, a sweetness in the way you smile, and something genuine about you that just feels good to be around. You don't try to be anything extra, you're just you, and that's what makes you so lovely.";

    function openLetter() {
      document.getElementById('envelope').style.display = 'none';
      const letterBox = document.getElementById('letter-box');
      letterBox.style.display = 'block';

      let i = 0;
      const textElement = document.getElementById('typewriter-text');
      textElement.innerHTML = '';

      const typing = setInterval(() => {
        if (i < noteMessage.length) {
          textElement.innerHTML += noteMessage.charAt(i);
          i++;
        } else {
          clearInterval(typing);
          document.getElementById('next-btn').style.display = 'inline-flex';
        }
      }, 30);
    }
  </script>
</body>
</html>
